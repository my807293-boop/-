  const{data:p,error:pe}=await sb.from('profiles').select('*').eq('id',u).maybeSingle();if(pe)showErr('profiles: '+pe.message);S.me=p;if(!p)return;

<h5>${T.myprog}</h5><div class="pg"><div class="prog">${hex(g.p)}</div><div><b>${g.dn}/${g.n}</b><small style="display:block;color:var(--mut)">${T.progress}</small></div></div>
<h5>${T.notifs}</h5>${ns.map(i=>`<button class="nt" style="--rc:${RC[i.author_role]||RC.dev}" data-ns="${i.subject_id}"><div><b>${esc(i.title)}</b><small>${esc(auth(i))} · ${esc((subOf(i)&&nm(subOf(i)))||'')} · ${fmt(i.created_at)}</small></div></button>`).join('')||`<p style="color:var(--mut);font-size:.9rem">${T.noNotif}</p>`}
<h5>${T.sett}</h5><div class="sl"><button data-mv="home">🏠 ${T.home}</button><button data-mv="fav">★ ${T.fav}</button><button id="lg">🌐 ${S.lang==='ar'?'English':'العربية'}</button><button id="th">◐ ${S.theme==='light'?'الوضع الليلي / Dark':'الوضع النهاري / Light'}</button>${ng?`<button id="bell">🔔 ${T.notif}</button>`:''}<a href="privacy.html">🔒 ${T.priv}</a><a href="terms.html">📄 ${T.terms}</a><button data-act="out">⎋ ${T.out}</button></div></aside>`}
function header(){const T=t(),n=notices().length;return `<header class="nv"><button class="lg2" data-v="home"><img src="logo.webp" alt=""><span>${T.title}</span></button><div class="sx"><input id="sq" type="search" placeholder="${T.srch}" autocomplete="off" aria-label="${T.srch}"><div id="sr"></div></div><button class="mb" data-act="dw" aria-label="${T.sett}">☰${n?`<b>${n}</b>`:''}</button></header>${S.drawer?drawer():''}`}
function floater(){const ns=notices();if(!ns.length||S.nbd)return'';const i=ns[0];return `<div class="fl" id="fl2" style="--rc:${RC[i.author_role]||RC.dev}"><div class="tx" data-act="dw"><small id="nbs">${esc(auth(i))} · ${esc((subOf(i)&&nm(subOf(i)))||'')}</small><b id="nbt">${esc(i.title)}</b></div><button class="x" data-act="nbx" aria-label="${t().close}">✕</button></div>`}
function home(){const T=t(),its=S.items.filter(grp),tr=its.filter(i=>i.type!=='notice'),g=prog(),hw=its.filter(i=>i.type==='hw').length,rec=its.filter(i=>!S.st.done.includes(i.id)).slice(0,6),en=S.lang!=='ar';
  const DM=['code.webp','hero-chip.webp','lock.webp','astro.webp'];
  return `<section id="top" class="hero"><div class="hbg"><img src="hero-chip.webp" alt=""></div>
<div class="ht"><h2 class="rl rg">${T.roles2.map((w,i)=>`<span class="ln"><span style="--d:${200+i*80}ms">${esc(w)}</span></span>`).join('')}</h2><p class="hd2 rv" style="--d:400ms">${T.desc2}</p></div>
<div class="pt2"><div class="pl"><img src="logo.webp" alt="شعار برنامج الحوسبة الذكية"></div></div><div class="gb"></div>
<h1 class="nm rg ${en?'en':''}">${T.nmx.map((l,i)=>`<span class="nl">${spl(l,i*240)}</span>`).join('')}</h1><div class="cue rv" style="--d:900ms">${T.cue2}</div></section>
<section class="mq" aria-hidden="true"><div class="mt2">${[0,1].map(()=>T.mq2.map(w=>`<span>${esc(w)}<i></i></span>`).join('')).join('')}</div></section>
<section class="sp2"><div class="shd"><div><div class="eb rv">${T.latest}</div><h2 class="h2y rg"><span class="ln"><span>${T.latest}</span></span></h2></div>${staff()?gsw():`<span class="tag">${T.group} ${S.g} · ${T.role[S.me.role]}</span>`}</div><div class="ig rv" style="margin-top:3rem">${rec.map(i=>itemCard(i,true)).join('')||`<p style="color:var(--mut)">${T.none}</p>`}</div></section>
<section id="story" class="sp2"><div class="g12"><div class="c6"><div class="eb rv">${T.stE}</div><h2 class="h2x rg"><span class="ln"><span>${T.stHd}</span></span></h2><p class="lead rv" style="--d:200ms">${T.stP}</p></div><ul class="pr c6">${T.prs.map((p,i)=>`<li class="rv" style="--d:${i*90}ms"><b class="n">0${i+1}</b><div><h3>${p[0]}</h3><p>${p[1]}</p></div></li>`).join('')}</ul></div></section>
<section id="subjects" class="sp2"><div class="shd"><div><div class="eb rv">${T.vsE}</div><h2 class="h2y rg"><span class="ln"><span>${T.vsH}</span></span></h2></div><span class="eb rv" style="--d:100ms">${String(S.subjects.length).padStart(2,'0')} / ${T.vsR}</span></div>
<ul class="sgd">${S.subjects.map((s,i)=>{const c=S.items.filter(x=>x.subject_id===s.id&&grp(x)&&x.type!=='notice').length;return `<li class="rv" style="--d:${(i%2)*120}ms"><div class="vc" role="button" tabindex="0" data-s="${s.id}"><div class="lqi"><img src="${DM[i%4]}" alt="" loading="lazy"></div><div class="vr"><div><h3>${esc(nm(s))}</h3><p>${T.subjTag}</p></div><span class="o">${c} ${T.files}</span></div></div></li>`}).join('')}${admin()?`<li><button class="vc add" id="as">${T.addSub}</button></li>`:''}</ul></section>
<section class="sp2"><div class="eb rv">${T.stT}</div><h2 class="h2y rg"><span class="ln"><span>${T.stH}</span></span></h2><div class="sgrid stats">${[[S.subjects.length,'',T.sSub],[tr.length,'',T.sFil],[hw,'',T.sHw],[g.p,'%',T.sPr]].map((x,i)=>`<div class="rv" style="--d:${i*110}ms"><div class="num"><span data-n="${x[0]}">0</span><u>${x[1]}</u></div><p>${x[2]}</p></div>`).join('')}</div></section>
<section id="voices" class="sp2"><div class="eb rv">${T.voE}</div><h2 class="h2y rg"><span class="ln"><span>${T.voH}</span></span></h2><div class="g12 vo"><ul class="vsl c5">${T.vos.map((v,i)=>`<li><button data-vi="${i}" class="${i===S.vi%3?'on':''}"><span class="ix">0${i+1}</span><span><span class="nn">${v[0]}</span><small>${T.voF}</small></span><span class="rl2"></span></button></li>`).join('')}</ul><div class="vf c7"><blockquote class="vq"><p id="vqt">“${wds2(T.vos[S.vi%3][1])}”</p><footer>${T.voF}</footer></blockquote><div class="lqi"><img id="vim" src="${T.vos[S.vi%3][2]}" alt=""></div></div></div></section>
<section id="contact" class="sp2 ct" style="padding-bottom:0"><div class="eb rv">${T.ctE}</div><h2 class="rg"><span class="ln"><span>${T.ctH}</span></span></h2><p class="lead rv">${T.ctP}</p><button class="em rv" data-sc="subjects">${T.ctB} ${ARW}</button></section>`+floater()}
const wds2=s=>s.split(' ').map((w,i)=>`<span class="wd" style="--d:${i*22}ms">${esc(w)}</span>`).join(' ');
function footer(){const T=t();return `<footer class="sp2" style="padding-top:0"><div class="ft"><div class="g12"><div class="c6"><p class="sig">${T.title}</p><p class="fs">${T.ftS} · ${T.slogan}</p></div><ul class="c3 fl3" style="grid-column:span 3"><li><a href="privacy.html">${T.priv}</a></li><li><a href="terms.html">${T.terms}</a></li><li><button data-mv="fav">${T.fav}</button></li></ul><p class="fs fe" style="grid-column:span 3">${T.rights}</p></div></div></footer>`}
function body(){const v=S.view;return v==='sub'||v==='fav'?`<main class="page">${v==='sub'?subj():favs()}</main>`:home()}
function subj(){const T=t(),s=S.subjects.find(x=>x.id===S.sid);if(!s){S.view='home';return ''}
  const its=S.items.filter(i=>i.subject_id===s.id&&grp(i)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),f=S.st.fav.includes('s:'+s.id);
  const secs=['notice','hw','file','link','image'].map(ty=>{const l=its.filter(i=>i.type===ty);return l.length?`<section class="ss"><div class="sh"><span class="it t-${ty}">${IC[ty]}</span><h3>${T.secs[ty]}</h3><span class="tag">${l.length}</span></div><div class="ig">${l.map(i=>itemCard(i)).join('')}</div></section>`:''}).join('');
  return `<button class="ib" data-v="home">← ${T.back}</button><div class="sth"><h1 class="sn">${esc(nm(s))}</h1><div class="row" style="display:flex;gap:.4rem"><button class="btn g" data-f="s:${s.id}">${f?'★':'☆'} ${T.fav}</button>${admin()?`<button class="btn g" data-es="${s.id}">${T.edit}</button><button class="btn r" data-xs="${s.id}">${T.del}</button>`:''}</div></div>${staff()?gsw()+form():''}${secs||`<p style="color:var(--mut);margin-top:2rem">${T.none}</p>`}`}
function favs(){const T=t(),a=S.st.fav;return `<h1 class="sn">★ ${T.fav}</h1><div class="ig" style="margin-top:1.5rem">${S.subjects.filter(s=>a.includes('s:'+s.id)).map(s=>`<div class="ic" role="button" data-s="${s.id}" style="cursor:pointer"><div class="ih"><span class="it">📚</span><div><h4>${esc(nm(s))}</h4><small>${T.subjTag}</small></div></div></div>`).join('')}${S.items.filter(i=>a.includes('i:'+i.id)).map(i=>itemCard(i,true)).join('')}</div>${a.length?'':`<p style="color:var(--mut)">${T.none}</p>`}`}
function render(bg){applyTheme();const a=$('#app');if(!S.ready){a.innerHTML='';return}
  if(!S.user||!S.me){a.innerHTML=`<main class="lgn">${loginView()}</main>`;bindLogin();return}
  const ae=document.activeElement;if(bg&&a.querySelector('header')&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&a.contains(ae))return;
  a.innerHTML=header()+body()+footer();bind();bind2()}
function bind(){const q=(s,f)=>document.querySelectorAll(s).forEach(f),T=t(),$=s=>document.querySelector(s)||{};
  q('[data-v]',b=>b.onclick=()=>{S.view=b.dataset.v;render()});q('[data-g]',b=>b.onclick=()=>{S.g=b.dataset.g;render()});
  q('[data-s]',b=>b.onclick=()=>{S.sid=b.dataset.s;S.view='sub';render();scrollTo(0,0)});
  q('[data-f]',b=>b.onclick=()=>tog('fav',b.dataset.f));q('[data-d]',b=>b.onclick=()=>tog('done',b.dataset.d));
  q('[data-x]',b=>b.onclick=async()=>{if(confirm(T.del+'؟')){await sb.from('items').delete().eq('id',b.dataset.x);soon()}});
  q('[data-e]',b=>b.onclick=async()=>{const i=S.items.find(x=>x.id===b.dataset.e),v=prompt(T.ttl,i.title);if(v){await sb.from('items').update({title:v}).eq('id',i.id);soon()}});
  q('[data-xs]',b=>b.onclick=async()=>{if(confirm(T.del+'؟')){await sb.from('subjects').delete().eq('id',b.dataset.xs);S.view='home';soon()}});
  q('[data-es]',b=>b.onclick=async()=>{const s=S.subjects.find(x=>x.id===b.dataset.es),v=prompt(T.subName,nm(s));if(v){await sb.from('subjects').update({['name_'+S.lang]:v}).eq('id',s.id);soon()}});
  q('[data-h]',b=>b.onchange=async()=>{const f=b.files[0];if(!f)return;if(f.type!=='application/pdf'){alert(T.pdfOnly);return}
    b.parentElement.firstChild.textContent=T.up;try{const url=await up(f);const{error}=await sb.from('submissions').insert({item_id:b.dataset.h,name:S.me.name,url});if(error)throw error;await refresh();render()}catch(e){alert(T.fail);render()}});
  const as=$('#as');if(as)as.onclick=async()=>{const v=prompt(T.subName);if(v){await sb.from('subjects').insert({name_ar:v,name_en:v});soon()}};
  $('#lg').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';ls('lang',S.lang);render()};
  $('#th').onclick=()=>{const dk=S.theme!=='light';S.theme=dk?'light':'dark';ls('theme',S.theme);render()};
  q('[data-act=out]',b=>b.onclick=out);
  const bl=$('#bell');if(bl)bl.onclick=async()=>{await Notification.requestPermission();render()};
  const nf=$('#nf');if(nf)nf.onsubmit=async e=>{e.preventDefault();const m=$('#fm'),ty=$('#ty').value,f=$('#fl').files[0],tx=$('#tx').value.trim();let url='';
    try{if(f){m.textContent=T.up;url=await up(f)}else if(ty==='link')url=tx;
      const{error}=await sb.from('items').insert({subject_id:S.sid,type:ty,title:$('#ti').value.trim(),body:tx,url,grp:$('#gg').value,author_name:S.me.name,author_role:S.me.role,hw_mode:ty==='hw'?$('#hm').value:null});if(error)throw error}catch(x){m.textContent=T.fail;return}
    await refresh();render()}}


let LN=null;
const lock=on=>{document.documentElement.style.overflow=on?'hidden':'';if(LN){on?LN.stop():LN.start()}};
function go(id){const el=document.getElementById(id);if(!el)return;LN?LN.scrollTo(el,{offset:-70}):el.scrollIntoView({behavior:'smooth'})}
try{import('https://cdn.jsdelivr.net/npm/lenis@1.3.19/dist/lenis.mjs').then(m=>{LN=new m.default({smoothWheel:true});if(!S.intro||S.drawer)LN.stop();const r=t=>{LN.raf(t);requestAnimationFrame(r)};requestAnimationFrame(r)}).catch(()=>{})}catch(e){}
(function(){const FB=16,bw=1920,co=.6666;const f=()=>{const w=innerWidth,s=FB-(FB*(((bw-w)/bw)*100*co))/100;s>FB?document.documentElement.style.fontSize=s+'px':document.documentElement.style.removeProperty('font-size')};f();addEventListener('resize',f)})();
function startLoader(){lock(true);const ld=document.getElementById('ld'),n=document.getElementById('ldn'),t0=performance.now();let done=false;
  const end=()=>{if(done)return;done=true;n.textContent='100';ld.classList.add('fade');setTimeout(()=>{ld.classList.add('out');setTimeout(()=>{ld.remove();S.intro=true;lock(S.drawer);reveal()},650)},200)};
  const step=now=>{const k=Math.min((now-t0)/2000,1);n.textContent=Math.round(k*100);k<1?requestAnimationFrame(step):end()};requestAnimationFrame(step);setTimeout(end,5000)}
function reveal(){const key=S.view+(S.sid||''),els=document.querySelectorAll('.rv,.rg');if(!S.intro)return;
  if(S.shown[key]){els.forEach(e=>e.classList.add('in'));return}S.shown[key]=1;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:0});els.forEach(e=>io.observe(e))}
function counters(){const st=$('.stats');if(!st)return;const all=()=>document.querySelectorAll('[data-n]');
  if(S.cnt){all().forEach(e=>e.textContent=e.dataset.n);return}
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){S.cnt=1;io.disconnect();all().forEach(el=>{const n=+el.dataset.n,t0=performance.now(),f=now=>{const p=Math.min((now-t0)/1400,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}},{threshold:.3});io.observe(st)}
function liquid(){if(innerWidth<=768||matchMedia('(hover:none)').matches)return;
  if(!document.getElementById('lqf'))document.body.insertAdjacentHTML('beforeend','<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lqf"><feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1"/></filter></svg>');
  const ft=document.querySelector('#lqf feTurbulence'),fd=document.querySelector('#lqf feDisplacementMap');
  document.querySelectorAll('.lqi').forEach(el=>{const im=el.querySelector('img');let v=0,tg=0,raf=0;
    const step=()=>{v+=(tg-v)*.12;if(Math.abs(tg-v)<.01)v=tg;fd.setAttribute('scale',1+27*v);ft.setAttribute('baseFrequency',(.009+.013*v).toFixed(4));if(v!==tg)raf=requestAnimationFrame(step);else if(!tg)im.style.filter=''};
    el.onmouseenter=()=>{im.style.filter='url(#lqf)';tg=1;cancelAnimationFrame(raf);raf=requestAnimationFrame(step)};el.onmouseleave=()=>{tg=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(step)}})}
function vsel(i){const v=t().vos[i];S.vi=i;const p=$('#vqt'),im=$('#vim');if(!p)return;p.innerHTML='“'+wds2(v[1])+'”';im.src=v[2];document.querySelectorAll('[data-vi]').forEach(b=>b.classList.toggle('on',+b.dataset.vi===i))}
function search(v){const T=t(),sr=$('#sr'),q=v.trim().toLowerCase();if(!q){sr.classList.remove('on');sr.innerHTML='';return}
  const r=[];S.subjects.forEach(s=>{if(nm(s).toLowerCase().includes(q))r.push({ic:'📚',t:nm(s),s:T.subjTag,sid:s.id})});
  S.items.filter(grp).forEach(i=>{if((i.title+' '+(i.body||'')).toLowerCase().includes(q)){const s=subOf(i);r.push({ic:IC[i.type]||'📄',t:i.title,s:T.type[i.type]+(s?' · '+nm(s):''),sid:i.subject_id})}});
  sr.innerHTML=r.slice(0,10).map(x=>`<button data-sr="${x.sid}"><span class="ico">${x.ic}</span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join('')||`<p>${T.noRes}</p>`;sr.classList.add('on');
  sr.querySelectorAll('[data-sr]').forEach(b=>b.onclick=()=>{S.sid=b.dataset.sr;S.view='sub';S.drawer=false;$('#sq').blur();render();scrollTo(0,0);if(LN)LN.scrollTo(0,{immediate:true})})}
function bind2(){const q=(s,f)=>document.querySelectorAll(s).forEach(f),T=t();
  q('[data-act=dw]',b=>b.onclick=()=>{S.drawer=true;render()});q('[data-act=dc]',b=>b.onclick=()=>{S.drawer=false;render()});
  q('[data-act=nbx]',b=>b.onclick=()=>{S.nbd=true;const e=$('#fl2');if(e)e.remove()});
  q('[data-act=out]',b=>b.onclick=()=>{S.drawer=false;out()});
  q('[data-mv]',b=>b.onclick=()=>{S.view=b.dataset.mv;S.drawer=false;render();scrollTo(0,0);if(LN)LN.scrollTo(0,{immediate:true})});
  q('[data-ns]',b=>b.onclick=()=>{S.sid=b.dataset.ns;S.view='sub';S.drawer=false;render();scrollTo(0,0);if(LN)LN.scrollTo(0,{immediate:true})});
  q('[data-sc]',b=>b.onclick=()=>{const id=b.dataset.sc;if(S.view!=='home'){S.view='home';render();setTimeout(()=>go(id),150)}else go(id)});
  q('[data-vi]',b=>{b.onclick=()=>vsel(+b.dataset.vi);b.onmouseenter=()=>{if(innerWidth>768)vsel(+b.dataset.vi)}});
  q('.vc[data-s]',b=>b.onkeydown=e=>{if(e.key==='Enter')b.click()});
  q('[data-hs]',b=>b.onclick=async()=>{const id=b.dataset.hs,inp=document.querySelector('[data-hl="'+id+'"]'),u=(inp.value||'').trim();if(!/^https?:\/\/\S+$/i.test(u)){alert(T.badUrl);return}
    b.disabled=true;const{error}=await sb.from('submissions').insert({item_id:id,name:S.me.name,url:u});if(error){alert(T.fail);b.disabled=false;return}await refresh();render()});
  const ty=$('#ty');if(ty)ty.onchange=()=>{$('#hm').style.display=ty.value==='hw'?'':'none'};
  const fl=$('#fl');if(fl)fl.onchange=()=>{$('#fn').textContent=fl.files[0]?fl.files[0].name:T.pickf};
  const sq=$('#sq');if(sq){sq.oninput=()=>search(sq.value);sq.onfocus=()=>{if(sq.value)search(sq.value)};sq.onblur=()=>setTimeout(()=>{const s=$('#sr');if(s)s.classList.remove('on')},200)}
  const ns=notices();clearInterval(S.cit);if(ns.length>1&&$('#nbt')){let k=0;S.cit=setInterval(()=>{const e=$('#nbt');if(!e)return;k=(k+1)%Math.min(ns.length,3);const i=ns[k],f=$('#fl2');e.textContent=i.title;$('#nbs').textContent=auth(i)+' · '+((subOf(i)&&nm(subOf(i)))||'');if(f)f.style.setProperty('--rc',RC[i.author_role]||RC.dev)},6000)}
  lock(S.drawer||!S.intro);reveal();counters();liquid()}
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.drawer){S.drawer=false;render()}});
startLoader();
boot();
</script>
</body>
