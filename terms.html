<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شروط الاستخدام</title><style>body{font-family:Tahoma,sans-serif;max-width:700px;margin:30px auto;padding:0 16px;line-height:1.9}</style></head><body><h1>شروط الاستخدام</h1><p>الموقع مخصص لطلاب دفعة برنامج الحوسبة الذكية لأغراض الدراسة فقط.</p><p>يلتزم المستخدم باستخدام حسابه الشخصي، وبعدم رفع محتوى مسيء أو مخالف لحقوق النشر، وبعدم مشاركة أكواد الدكتور أو القائد أو المطور.</p><p>يحق للمطور وقادة الدفعة حذف أي محتوى أو حساب مخالف.</p><p><a href="./">العودة للموقع</a></p></body></html>
